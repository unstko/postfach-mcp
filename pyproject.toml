[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postfach-mcp"
version = "0.2.0"
description = "Read-focused remote MCP server for IMAP mailboxes: search, read, create drafts - no send, no delete"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1,<3",
    "imap-tools>=1.15",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    # The Starlette test client used in the server tests is powered by httpx.
    "httpx>=0.28",
]

[project.scripts]
postfach-mcp = "postfach_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
postfach_mcp = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "imap_tools.*"
ignore_missing_imports = true
